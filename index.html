<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filmmaking: From Story to Screen | Free online course</title>
<meta name="description" content="A free online filmmaking course in Sinhala, Tamil and English for O/L and A/L students and beginners. Earn a certificate and digital badge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Caveat:wght@600&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#EDEFEA; --card:#F8F9F6; --ink:#1A1D29; --slate:#596172; --line:#CDD1C8;
  --tungsten:#D98E1F; --tungsten-soft:#F6E2BF; --daylight:#3563AE; --daylight-soft:#DCE6F5;
  --strip:#1A1D29; --strip-frame:#2E3344; --ok:#2F7D4F; --err:#B23A2E;
  --sans:'Archivo','Noto Sans Sinhala','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Newsreader','Noto Sans Sinhala','Noto Sans Tamil',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14161D; --card:#1C1F28; --ink:#E8E9E3; --slate:#A2A8B5; --line:#2E3240;
    --tungsten:#F0A93E; --tungsten-soft:#3A2E1A; --daylight:#82A6E3; --daylight-soft:#1E2A40;
    --strip:#0C0E13; --strip-frame:#262A37; --ok:#5DBB83; --err:#E77B6F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14161D; --card:#1C1F28; --ink:#E8E9E3; --slate:#A2A8B5; --line:#2E3240;
  --tungsten:#F0A93E; --tungsten-soft:#3A2E1A; --daylight:#82A6E3; --daylight-soft:#1E2A40;
  --strip:#0C0E13; --strip-frame:#262A37; --ok:#5DBB83; --err:#E77B6F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg,canvas{max-width:100%}
a{color:var(--daylight)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--daylight);outline-offset:2px;border-radius:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--sans);font-stretch:82%;line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700;font-stretch:90%}
p{margin:0 0 1em}
.muted{color:var(--slate)}
.small{font-size:.88rem}
.demo-bar{background:var(--daylight);color:#fff;font-size:.85rem;text-align:center;padding:6px 12px}
.demo-bar a{color:#fff}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-stretch:80%;font-size:1.15rem;margin-right:auto;white-space:nowrap}
.nav{display:flex;align-items:center;gap:6px}
.nav a{color:var(--ink);text-decoration:none;padding:8px 10px;border-radius:6px;font-size:.95rem}
.nav a:hover{background:var(--card)}
.nav a.on{font-weight:700;box-shadow:inset 0 -2px 0 var(--tungsten);border-radius:0}
.lang{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 8px;font-size:.9rem}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
@media (max-width:860px){
  .menu-btn{display:block}
  .nav{position:absolute;left:0;right:0;top:64px;background:var(--paper);flex-direction:column;align-items:stretch;padding:10px 20px 16px;border-bottom:1px solid var(--line);display:none}
  .nav.open{display:flex}
  .nav a.on{box-shadow:inset 3px 0 0 var(--tungsten)}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:13px 20px;font-weight:700;font-stretch:90%;text-decoration:none;cursor:pointer;font-size:1rem;line-height:1.2;text-align:center}
.btn-primary{background:var(--tungsten);color:#1A1D29}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-link{background:none;border:0;color:var(--daylight);padding:6px 0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn[disabled],.btn.busy{opacity:.55;cursor:wait}
.btn-sm{padding:10px 14px;font-size:.92rem}
.btn-block{width:100%}
.nav .btn{padding:9px 14px;font-size:.92rem}
.btn-google{background:var(--card);color:var(--ink);border:1.5px solid var(--line);width:100%}

/* hero */
.hero{padding:52px 0 60px}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.4rem);font-stretch:75%;max-width:12ch}
.hero .lead{font-size:1.15rem;max-width:44ch;color:var(--slate)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;align-items:center}
.cta-note{font-size:.88rem;color:var(--slate);width:100%;margin-top:-2px}
.langs-note{margin-top:20px;font-size:.92rem;color:var(--slate)}
.langs-note b{color:var(--ink);font-weight:600}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:36px}.hero{padding-top:30px}}

/* slate */
.slate{max-width:460px;width:100%;justify-self:center;filter:drop-shadow(0 18px 30px rgba(20,22,30,.22))}
.clap{position:relative;height:54px}
.arm,.bar{position:absolute;left:0;right:0;height:34px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(-55deg,#1A1D29 0 26px,#F2F2EC 26px 52px);border:3px solid #1A1D29}
.bar{bottom:0;border-radius:0}
.arm{bottom:20px;transform-origin:6px 100%;transform:rotate(-16deg)}
.arm.snap{animation:snap .5s cubic-bezier(.6,0,.9,.5) .55s both}
@keyframes snap{from{transform:rotate(-16deg)}to{transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){.arm.snap{animation:none}}
.board{background:#22262F;color:#F4F4EE;border:3px solid #1A1D29;border-top:0;border-radius:0 0 8px 8px;padding:6px 0 0}
.board .row{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid rgba(244,244,238,.55)}
.board .row:first-child{border-top:0}
.board .cell{padding:8px 14px 10px;border-left:1.5px solid rgba(244,244,238,.55);min-width:0}
.board .cell:first-child{border-left:0}
.board .full{grid-column:1/-1}
.board .lbl{font-size:.74rem;opacity:.7;font-stretch:90%}
.board .val{font-family:var(--hand);font-size:1.75rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .val.big{font-size:2.1rem}

/* sections */
.sec{padding:60px 0;border-top:1px solid var(--line)}
.sec-head{max-width:640px;margin-bottom:28px}
.shotlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border-top:2px solid var(--ink)}
.shot{padding:18px 18px 20px 0;border-bottom:1px solid var(--line)}
.shot .n{font-weight:800;font-stretch:75%;font-size:1.8rem;color:var(--tungsten);line-height:1;display:block;margin-bottom:8px}
.shot h3{margin:0 0 4px}
.shot p{margin:0;font-size:.93rem;color:var(--slate)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s;padding:0;margin:0}
.steps li{list-style:none;padding-top:16px;border-top:3px solid var(--ink)}
.steps li:last-child{border-top-color:var(--tungsten)}
.steps b{display:block;font-stretch:85%;font-size:1.1rem;margin-bottom:4px}
.steps li::before{counter-increment:s;content:counter(s);font-weight:800;font-stretch:75%;font-size:2rem;display:block;line-height:1;margin-bottom:8px}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

.academy-band{background:var(--ink);color:var(--paper);padding:68px 0}
.academy-band .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}
.academy-band h2{font-size:clamp(2rem,4.6vw,3.1rem);font-stretch:75%}
.academy-band p{color:color-mix(in srgb,var(--paper) 78%,var(--ink))}
.academy-band .btn-ghost{color:var(--paper);border-color:var(--paper)}
.compare{border:1px solid color-mix(in srgb,var(--paper) 25%,transparent);border-radius:10px;overflow:hidden}
.compare div{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent)}
.compare div:first-child{border-top:0;font-weight:700}
.compare span{padding:12px 14px;font-size:.95rem}
.compare span+span{border-left:1px solid color-mix(in srgb,var(--paper) 18%,transparent);background:color-mix(in srgb,var(--tungsten) 16%,transparent)}
@media (max-width:860px){.academy-band .wrap{grid-template-columns:1fr}}

.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:650;font-stretch:92%;font-size:1.05rem}
.faq details p{margin:10px 0 0;color:var(--slate);max-width:68ch}
footer{padding:36px 0 48px;border-top:1px solid var(--line);color:var(--slate);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}

/* forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
@media (max-width:520px){.panel{padding:22px 18px}}
.auth{max-width:440px;margin:40px auto 72px}
.field{margin-bottom:14px}
.field label,.lbl-text{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--daylight);outline:none;box-shadow:0 0 0 3px var(--daylight-soft)}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--daylight);font-weight:600;font-size:.88rem;cursor:pointer;padding:6px 8px}
.hint{font-size:.84rem;color:var(--slate);margin-top:5px}
.error{color:var(--err);font-size:.92rem;font-weight:600;min-height:1.2em;margin:2px 0 10px}
.seg{display:flex;gap:6px}
.seg label{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:9px 6px;cursor:pointer;background:var(--paper);font-weight:600;font-size:.95rem}
.seg label:has(input:checked){border-color:var(--tungsten);background:var(--tungsten-soft)}
.seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--paper);font-size:.93rem;user-select:none}
.chip:has(input:checked){border-color:var(--tungsten);background:var(--tungsten-soft);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;margin:4px 0 16px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--tungsten);flex:0 0 auto}
.or{display:flex;align-items:center;gap:12px;color:var(--slate);font-size:.85rem;margin:16px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;background:var(--paper)}
.choice:has(input:checked){border-color:var(--tungsten);background:var(--tungsten-soft)}
.choice input{accent-color:var(--tungsten);width:18px;height:18px;flex:0 0 auto}

/* filmstrip */
.strip{position:relative;background:var(--strip);border-radius:6px;padding:20px 12px;overflow-x:auto;scrollbar-width:thin}
.frames{position:relative;display:flex;gap:5px;width:max-content;min-width:100%}
.frames::before,.frames::after{content:"";position:absolute;left:-6px;right:-6px;height:8px;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(237,239,234,.82) 7px 15px,transparent 15px 22px)}
.frames::before{top:-15px}.frames::after{bottom:-15px}
.frame{flex:1 0 40px;min-width:40px;height:42px;border-radius:2px;background:var(--strip-frame);color:#AEB4C2;font-size:.72rem;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;text-decoration:none}
.frame.done{background:#E8A23A;color:#1A1D29}
.frame.cur{outline:2.5px solid #9FBEF0;outline-offset:2px}
.frame.gap{margin-left:9px}
.frame:hover{filter:brightness(1.18)}
.strip-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--slate);margin-top:10px}
.strip-legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}

/* dashboard */
.dash{padding:32px 0 72px}
.dash-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.dash-head h1{margin:0}
.pct{font-weight:800;font-stretch:75%;font-size:3rem;line-height:1}
.pct small{font-size:1rem;font-weight:500;color:var(--slate);font-stretch:100%;margin-left:6px}
.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;margin-top:26px;align-items:start}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr}}
.next{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tungsten);border-radius:10px;padding:20px 22px;margin-bottom:24px}
.next .k{font-size:.85rem;color:var(--slate)}
.next h3{margin:2px 0 0;font-size:1.3rem}
.about{background:var(--daylight-soft);border-radius:10px;padding:20px 22px;margin-bottom:24px}
.about h3{margin-bottom:4px}
.about .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.about select{padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.mods{border-top:2px solid var(--ink)}
.mod{border-bottom:1px solid var(--line)}
.mod>summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:16px 0;cursor:pointer}
.mod>summary::-webkit-details-marker{display:none}
.mod .n{font-weight:800;font-stretch:75%;font-size:1.5rem;color:var(--slate)}
.mod.complete .n{color:var(--tungsten)}
.mod h3{margin:0;font-size:1.12rem}
.mod .meta{font-size:.86rem;color:var(--slate)}
.mod .tally{font-size:.85rem;font-weight:700;color:var(--slate);white-space:nowrap}
.mod.complete .tally{color:var(--ok)}
.mod ul{list-style:none;margin:0 0 14px;padding:0 0 0 52px}
.mod li a{display:flex;gap:10px;align-items:center;padding:8px 0;text-decoration:none;color:var(--ink)}
.mod li a:hover .t{text-decoration:underline}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:.7rem}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mod li .d{margin-left:auto;font-size:.85rem;color:var(--slate);white-space:nowrap}
.credits{background:var(--strip);color:#EDEFEA;border-radius:10px;padding:24px 22px;text-align:center}
.credits h3{color:#E8A23A;font-stretch:80%;margin-bottom:12px}
.credits .role{font-size:.78rem;color:#9AA1B0;margin-top:12px}
.credits .who{font-weight:700;font-stretch:88%;font-size:1.05rem}
.credits .who.todo{color:#4C5263;font-weight:500}
.credits p{font-size:.86rem;color:#9AA1B0;margin:14px 0 0}
.acad-card{margin-top:20px;border:2px solid var(--ink);border-radius:10px;padding:22px}
.acad-card p{font-size:.95rem;color:var(--slate)}

/* lesson */
.lesson{padding:26px 0 72px}
.lesson-grid{display:grid;grid-template-columns:250px 1fr;gap:40px;align-items:start}
@media (max-width:900px){.lesson-grid{grid-template-columns:1fr}.side{order:2;position:static}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.side h4{margin:0 0 8px;font-size:.86rem;color:var(--slate);font-weight:600}
.side ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.side li a{display:flex;gap:8px;align-items:center;padding:7px 0 7px 12px;margin-left:-2px;border-left:2px solid transparent;text-decoration:none;color:var(--ink);font-size:.93rem}
.side li a.on{border-left-color:var(--tungsten);font-weight:700}
.crumb{font-size:.9rem;color:var(--slate);margin-bottom:8px}
.crumb a{color:var(--slate)}
.preview{background:var(--tungsten-soft);border-radius:8px;padding:10px 14px;font-size:.92rem;margin-bottom:16px;max-width:68ch}
.video{position:relative;aspect-ratio:16/9;background:#101218;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#EDEFEA;margin:16px 0 26px;max-width:68ch}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{width:72px;height:72px;border-radius:50%;background:#E8A23A;display:grid;place-items:center;border:0;cursor:pointer}
.video .cap{position:absolute;left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;font-size:.85rem;color:#B8BDC9;gap:10px}
.reading{font-family:var(--serif);font-size:1.15rem;line-height:1.7;max-width:66ch}
.reading p{margin:0 0 1.1em}
.reading strong{font-family:var(--sans);font-size:.94em}
.box{border-radius:10px;padding:20px 22px;margin:24px 0;max-width:66ch}
.box h3{font-size:1.05rem;margin-bottom:8px}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:4px}
.box.take{background:var(--card);border:1px solid var(--line)}
.box.try{background:var(--daylight-soft);border-left:5px solid var(--daylight)}
.box.acad{background:var(--tungsten-soft);border-left:5px solid var(--tungsten)}
.box.acad a{font-weight:700}
.lesson-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line);max-width:66ch}
.lang-note{font-size:.9rem;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;max-width:66ch}
.save-card{max-width:66ch;margin-top:32px;border:2px solid var(--tungsten)}
.save-card h2{font-size:1.6rem}

/* quiz */
.q{margin:0 0 24px;max-width:66ch}
.q legend{font-weight:700;font-size:1.08rem;margin-bottom:10px;font-stretch:95%}
.q fieldset{border:0;padding:0;margin:0}
.q .choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.q .choice.wrong{border-color:var(--err);background:color-mix(in srgb,var(--err) 12%,var(--paper))}
.why{font-size:.93rem;margin-top:8px;color:var(--slate)}
.result{border-radius:12px;padding:24px;margin:10px 0 26px;max-width:66ch}
.result.pass{background:var(--tungsten-soft);border:2px solid var(--tungsten)}
.result.fail{background:var(--card);border:2px solid var(--line)}
.result .credit{font-stretch:80%;font-size:1.6rem;font-weight:800;margin:6px 0 10px}

/* certificate */
.cert-wrap{padding:34px 0 72px}
.cert-grid{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start;margin-top:22px}
@media (max-width:900px){.cert-grid{grid-template-columns:1fr}}
.cert-view,.badge-view{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.cert-view img{display:block;width:100%;height:auto;border-radius:4px}
.badge-view{text-align:center;padding:22px}
.badge-view img{width:200px;height:200px}
.actions-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.disclaim{font-size:.85rem;color:var(--slate);margin-top:14px;max-width:70ch}
.locked{max-width:640px}
.remaining{list-style:none;padding:0;margin:16px 0 22px;border-top:1px solid var(--line)}
.remaining li{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:12px}
.verify{max-width:560px;margin:48px auto 80px;text-align:center}
.verify .seal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:2rem;color:#fff}

/* academy */
.acad-hero{background:var(--ink);color:var(--paper);padding:60px 0 52px}
.acad-hero h1{font-size:clamp(2.3rem,6vw,3.9rem);font-stretch:75%;max-width:15ch}
.acad-hero p{max-width:56ch;color:color-mix(in srgb,var(--paper) 78%,var(--ink));font-size:1.12rem}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px;border-top:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
.facts div{padding:16px 16px 0 0}
.facts span{display:block;font-size:.82rem;color:color-mix(in srgb,var(--paper) 60%,var(--ink))}
.facts b{font-stretch:85%;font-size:1.1rem}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}}
.gets{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 28px}
.gets div{border-top:3px solid var(--tungsten);padding-top:14px}
.gets p{color:var(--slate);font-size:.96rem;margin:0}
@media (max-width:860px){.gets{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.gets{grid-template-columns:1fr}}
.enquire{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:start}
@media (max-width:860px){.enquire{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.done-msg{border:2px solid var(--ok);border-radius:12px;padding:24px;background:color-mix(in srgb,var(--ok) 10%,var(--card))}

.loading{display:grid;place-items:center;min-height:60vh;color:var(--slate)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:8px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

const friendly = e => {
  const m=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(m)) return "That email and password don't match. Check them and try again.";
  if(/Email not confirmed/i.test(m)) return "Confirm your email first. Check your inbox for the link we sent.";
  if(/already registered|already exists/i.test(m)) return "An account with this email already exists. Log in instead.";
  if(/Password should be/i.test(m)) return "Use a password of at least 6 characters.";

  return m;
};

function makeSupabaseApi(){
  const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  let uid=null;
  return {
    async session(){ const {data}=await sb.auth.getSession(); uid=data.session?.user?.id||null; return data.session?{id:uid,email:data.session.user.email}:null; },
    onAuth(cb){ sb.auth.onAuthStateChange((ev,s)=>{ uid=s?.user?.id||null; cb(ev,s?{id:uid,email:s.user.email}:null); }); },
    async signUp({name,email,password,lang,optin}){
      const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:CONFIG.siteUrl,data:{full_name:name,language:lang,academy_optin:optin}}});
      if(error) throw error;
      if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0) throw new Error("already registered");
      uid=data.session?.user?.id||null;
      return {needsConfirm:!data.session};
    },
    async signIn(email,password){ const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; uid=data.user.id; },
    async google(){ const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:CONFIG.siteUrl}}); if(error) throw error; },
    async signOut(){ await sb.auth.signOut(); uid=null; },
    async resetPassword(email){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:CONFIG.siteUrl}); if(error) throw error; },
    async updatePassword(pw){ const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error; },
    async load(){
      const [p,l,q,c]=await Promise.all([
        sb.from("profiles").select("*").eq("id",uid).maybeSingle(),
        sb.from("lesson_progress").select("lesson_id"),
        sb.from("quiz_attempts").select("section,score,passed"),
        sb.from("certificates").select("*").maybeSingle()
      ]);
      for(const r of [p,l,q,c]) if(r.error) throw r.error;
      return { profile:p.data||{full_name:"",language:"en"}, done:(l.data||[]).map(r=>r.lesson_id), attempts:q.data||[], cert:c.data||null };
    },
    async completeLesson(id){ const {error}=await sb.from("lesson_progress").upsert({user_id:uid,lesson_id:id},{onConflict:"user_id,lesson_id",ignoreDuplicates:true}); if(error) throw error; },
    async submitQuiz(section,answers){ const {data,error}=await sb.rpc("submit_quiz",{p_section:section,p_answers:answers}); if(error) throw error; return data; },
    async issueCertificate(){ const {data,error}=await sb.rpc("issue_certificate"); if(error) throw error; return data; },
    async updateProfile(patch){ const {error}=await sb.from("profiles").update(patch).eq("id",uid); if(error) throw error; },
    async submitEnquiry(row){ const {error}=await sb.from("academy_enquiries").insert(row); if(error) throw error; },
    async verify(id){ const {data,error}=await sb.rpc("verify_certificate",{p_id:id}); if(error) throw error; return data&&data[0]||null; }
  };
}
function makeDemoApi(){
  const db=()=>local.get("sts_demo_db",{users:{},enquiries:[]}); const put=d=>local.set("sts_demo_db",d);
  let cur=local.get("sts_demo_session",null); let authCb=()=>{};
  const U=()=>db().users[cur];
  const mut=f=>{const d=db(); f(d.users[cur],d); put(d);};
  const hash=s=>{let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))|0; return "d"+h;};
  return {
    async session(){ return cur&&U()?{id:cur,email:cur}:null; },
    onAuth(cb){ authCb=cb; },
    async signUp({name,email,password,lang,optin}){
      const d=db(); if(d.users[email]) throw new Error("already registered");
      d.users[email]={pw:hash(email+password),profile:{full_name:name,language:lang,academy_optin:optin,created_at:new Date().toISOString()},done:[],attempts:[],cert:null}; put(d);
      cur=email; local.set("sts_demo_session",cur); return {needsConfirm:false};
    },
    async signIn(email,password){ const u=db().users[email]; if(!u||u.pw!==hash(email+password)) throw new Error("Invalid login credentials"); cur=email; local.set("sts_demo_session",cur); },
    async google(){ throw new Error("Google sign-in works once Supabase is connected."); },
    async signOut(){ cur=null; local.set("sts_demo_session",null); },
    async resetPassword(){ },
    async updatePassword(){ },
    async load(){ const u=U(); return {profile:u.profile,done:u.done,attempts:u.attempts,cert:u.cert}; },
    async completeLesson(id){ mut(u=>{ if(!u.done.includes(id)) u.done.push(id); }); },
    async submitQuiz(section,answers){
      const qz=SECTIONS.find(s=>s.id===section).quiz; const score=qz.filter((q,i)=>answers[i]===q.a).length; const passed=score*3>=qz.length*2;
      mut(u=>u.attempts.push({section,score,passed})); return {score,total:qz.length,passed};
    },
    async issueCertificate(){
      const u=U(); if(u.cert) return u.cert;
      if(!LESSONS.every(l=>u.done.includes(l.id))) throw new Error("Lessons not finished");
      if(!SECTIONS.every(s=>u.attempts.some(a=>a.section===s.id&&a.passed))) throw new Error("Quizzes not passed");
      const c="ABCDEF0123456789"; let r=""; for(let i=0;i<8;i++) r+=c[Math.floor(Math.random()*16)];
      const cert={id:`STS-${new Date().getFullYear()}-${r}`,full_name:u.profile.full_name,issued_at:new Date().toISOString()};
      mut(x=>x.cert=cert); return cert;
    },
    async updateProfile(patch){ mut(u=>Object.assign(u.profile,patch)); },
    async submitEnquiry(row){ const d=db(); d.enquiries.push({...row,created_at:new Date().toISOString()}); put(d); },
    async verify(id){ const u=Object.values(db().users).find(u=>u.cert&&u.cert.id===String(id).trim().toUpperCase()); return u?{full_name:u.cert.full_name,issued_at:u.cert.issued_at}:null; }
  };
}
const api = DEMO || !window.supabase ? makeDemoApi() : makeSupabaseApi();

const S = { user:null, profile:null, done:new Set(), passed:new Set(), best:{}, cert:null, ready:false, recovery:false };
let guestLang = local.get("sts_lang","en");
const lang = ()=> S.profile?.language || guestLang;
const t = k => (STR[lang()]&&STR[lang()][k]) || STR.en[k] || k;
const st = s => s.title[lang()] || s.title.en;
const firstName = ()=> (S.profile?.full_name||"").split(" ")[0] || "";
const isDone = id => id.startsWith("quiz") ? S.passed.has(+id.slice(4)) : S.done.has(id);
const doneCount = ()=> STEPS.filter(s=>isDone(s.id)).length;
const pct = ()=> Math.round(doneCount()/STEPS.length*100);
const nextStep = ()=> STEPS.find(s=>!isDone(s.id));
const secDone = s => STEPS.filter(x=>x.sec===s).every(x=>isDone(x.id));
const allDone = ()=> STEPS.every(s=>isDone(s.id));
const guestDone = ()=> local.get("sts_guest_done",[]);

async function loadUser(){
  const d=await api.load();
  S.profile=d.profile; S.done=new Set(d.done); S.cert=d.cert;
  S.passed=new Set(); S.best={};
  d.attempts.forEach(a=>{ if(a.passed) S.passed.add(a.section); S.best[a.section]=Math.max(S.best[a.section]||0,a.score); });
  // carry over a lesson finished before signing up
  const g=guestDone().filter(id=>!S.done.has(id));
  for(const id of g){ try{ await api.completeLesson(id); S.done.add(id); }catch(e){} }
  if(g.length) local.set("sts_guest_done",[]);
}
async function ensureCertificate(){
  if(S.cert || !allDone()) return;
  try{ S.cert=await api.issueCertificate(); }catch(e){ console.warn(e); }
}

function render(){
  if(!S.ready) return;
  const raw=location.hash.replace(/^#\/?/,"");
  if(/access_token|error_description|type=recovery/.test(raw)) return; // Supabase is handling an email link
  const [route,param]=raw.split("/");
  const authOnly=["home","quiz","certificate","profile"];
  if(S.recovery && route!=="reset"){ location.hash="#/reset"; return; }
  if(authOnly.includes(route) && !S.user){ location.hash="#/join"; return; }
  if(route==="lesson" && !S.user && param!==FREE_LESSON){ location.hash="#/join"; return; }
  if(S.user && ["join","login","check"].includes(route)){ location.hash="#/home"; return; }
  if(S.user && route==="" ){ /* logged-in visitors can still see the landing page */ }
  document.documentElement.lang=lang();
  renderNav(route||"");
  const V={join:vJoin,login:vLogin,forgot:vForgot,reset:vReset,check:vCheck,home:vHome,lesson:vLesson,quiz:vQuiz,certificate:vCertificate,academy:vAcademy,profile:vProfile,verify:vVerify};
  app.innerHTML=(V[route]||vLanding)(param);
  const B={join:bindAuthForm,lesson:bindLesson,login:bindLogin,forgot:bindForgot,reset:bindReset,home:bindHome,quiz:bindQuiz,certificate:bindCertificate,academy:bindAcademy,profile:bindProfile};
  B[route]&&B[route](param);
  if(render._last!==location.hash){ window.scrollTo(0,0); render._last=location.hash; }
}

/* ---------- certificate & badge (drawn on canvas so fonts and scripts render correctly) */
const FONT = (w,px)=>`${w} ${px}px Archivo, "Noto Sans Sinhala", "Noto Sans Tamil", Arial, sans-serif`;
async function fontsReady(){ try{ await Promise.all([document.fonts.load(FONT(800,60)),document.fonts.load(FONT(700,20)),document.fonts.load(FONT(400,20))]); await document.fonts.ready; }catch(e){} }
function fitText(ctx,text,weight,start,maxW){ let px=start; ctx.font=FONT(weight,px); while(ctx.measureText(text).width>maxW&&px>24){px-=2;ctx.font=FONT(weight,px);} return px; }
function drawBadge(ctx,cx,cy,r,year){
  ctx.save(); ctx.translate(cx,cy); const k=r/170;
  const circ=(rad,col)=>{ctx.beginPath();ctx.arc(0,0,rad*k,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();};
  circ(170,"#1A1D29"); circ(160,"#D98E1F"); circ(140,"#1A1D29");
  ctx.fillStyle="#D98E1F"; for(let i=0;i<24;i++){ ctx.save(); ctx.rotate(i/24*Math.PI*2); ctx.beginPath(); ctx.roundRect(-4*k,-136*k,8*k,11*k,2*k); ctx.fill(); ctx.restore(); }
  circ(122,"#FBFBF8");
  ctx.textAlign="center"; ctx.fillStyle="#596172"; ctx.font=FONT(700,20*k); ctx.fillText("Filmmaking",0,-56*k);
  ctx.fillStyle="#1A1D29"; ctx.font=FONT(800,42*k); ctx.fillText("Story to",0,-10*k); ctx.fillText("Screen",0,36*k);

  x.strokeStyle="#1A1D29"; x.lineWidth=1.5; x.strokeRect(40,70,W-80,H-140); x.fillStyle="#D98E1F"; x.fillRect(40,70,10,H-140);

  lab("Date",fmtDate(cert.issued_at),100); lab("Credential ID",cert.id,330);

const toBlob = c => new Promise(r=>c.toBlob(r,"image/png"));
let hostDownloads=null;
if(window.claude && typeof window.claude.use==="function") window.claude.use("downloads").then(d=>hostDownloads=d).catch(()=>{});
async function saveBlob(name,blob){
  if(hostDownloads){ try{ await hostDownloads.save({filename:name,data:blob}); }catch(e){ if(e?.code!=="declined") toast("That file couldn't be saved here."); } return; }
  const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b) return; const a=b.dataset.a;
  if(a==="pwToggle"){ const i=b.previousElementSibling; const show=i.type==="password"; i.type=show?"text":"password"; b.textContent=show?t("hide"):t("show"); }
  if(a==="google"){ try{ await api.google(); }catch(ex){ toast(friendly(ex)); } }
  if(a==="play") toast(t("video_soon"));
  if(a==="toEnquire"){ e.preventDefault(); document.getElementById("enquire")?.scrollIntoView({behavior:"smooth"}); }
  if(a==="doneLesson"){
    const id=b.dataset.id; busy(b,true);
    try{ await api.completeLesson(id); S.done.add(id); const nx=STEPS[STEPS.findIndex(s=>s.id===id)+1]; go(nx?stepHref(nx):"#/home"); }
    catch(ex){ toast(friendly(ex)); busy(b,false); }
  }
  if(a==="retry"){ delete quizState[b.dataset.id]; render(); }
  if(a==="saveAbout"){
    const s=(document.querySelector('input[name=stage]:checked')||{}).value||null, d=document.getElementById("dist").value||null;
    if(!s&&!d) return toast("Tap an option first, or choose Not now.");
    try{ await api.updateProfile({stage:s,district:d}); Object.assign(S.profile,{stage:s||S.profile.stage,district:d}); toast("Thanks!"); local.set("sts_about_dismissed_"+S.user.id,true); render(); }catch(ex){ toast(friendly(ex)); }
  }
  if(a==="dismissAbout"){ local.set("sts_about_dismissed_"+S.user.id,true); document.getElementById("aboutCard")?.remove(); }
  if(a==="dlPng"){ saveBlob(`Story-to-Screen-certificate-${S.cert.id}.png`, await toBlob(await certificateCanvas(S.cert))); }
  if(a==="dlBadge"){ saveBlob(`Story-to-Screen-badge-${S.cert.id}.png`, await toBlob(await badgeCanvas(S.cert))); }
  if(a==="dlPdf"){
    const c=await certificateCanvas(S.cert);
    if(!window.jspdf){ toast("PDF isn't available right now. Download the PNG instead."); return; }
    const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:[1100,778]});

  }
  if(a==="logout"){ await api.signOut(); Object.assign(S,{user:null,profile:null,done:new Set(),passed:new Set(),best:{},cert:null}); go("#/"); }
});

(async function start(){
  if(DEMO) document.getElementById("demoBar").innerHTML=`<div class="demo-bar">Demo mode: accounts and progress are saved in this browser only. Add your Supabase keys in CONFIG to go live.</div>`;
  const h=location.hash;
  const fromEmailLink=/access_token|type=signup|type=magiclink/.test(h);
  if(/type=recovery/.test(h)) S.recovery=true;
  api.onAuth(ev=>{ if(ev==="PASSWORD_RECOVERY"){ S.recovery=true; if(S.ready) go("#/reset"); } });
  if(/error_description/.test(h)){
    const m=decodeURIComponent((h.match(/error_description=([^&]+)/)||[])[1]||"").replace(/\+/g," ");
    history.replaceState(null,"",location.pathname+"#/login"); setTimeout(()=>toast(m||"That link has expired. Log in or request a new one."),300);
  }
  try{
    S.user=await api.session();
    if(S.user && !S.recovery) await loadUser();
  }catch(e){ console.error(e); toast(friendly(e)); }
  S.ready=true;
  if(/access_token/.test(location.hash) && !S.user) history.replaceState(null,"",location.pathname+"#/login");
  if(S.recovery){ history.replaceState(null,"",location.pathname+"#/reset"); }
  else if(fromEmailLink && S.user){ const nx=nextStep(); history.replaceState(null,"",location.pathname+(nx?stepHref(nx):"#/home")); setTimeout(()=>toast(`Welcome, ${firstName()}. Your email is confirmed.`),300); }
  render();
})();
